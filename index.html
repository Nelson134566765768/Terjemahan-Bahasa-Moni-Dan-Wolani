<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penerjemah Bahasa Moni & Wolani</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; scroll-behavior: smooth; }
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: white;
      background: linear-gradient(135deg, #1a1a40, #090921);
      background-attachment: fixed;
      overflow-x: hidden;
      transition: background 0.8s ease, color 0.8s ease;
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 25px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(0,0,0,0.3);
    }
    header h1 {
      margin: 0;
      font-size: 2em;
      color: #fff;
      text-shadow: 0 0 20px #6a11cb, 0 0 30px #2575fc;
    }
    nav {
      margin-top: 10px;
    }
    nav a {
      color: #4facfe;
      text-decoration: none;
      margin: 0 15px;
      font-weight: 600;
      transition: 0.3s;
    }
    nav a:hover {
      color: #fff;
      text-shadow: 0 0 15px #6a11cb;
    }

    /* KONTEN */
    section {
      padding: 60px 10%;
      animation: fadeIn 1.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 40px;
    }

    .box {
      flex: 1;
      min-width: 280px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .box:hover {
      transform: translateY(-8px);
      box-shadow: 0 0 25px rgba(106,17,203,0.5);
    }

    label {
      font-weight: 600;
      font-size: 1.1em;
    }

    select, textarea {
      width: 100%;
      margin-top: 10px;
      font-size: 1em;
      padding: 14px;
      border-radius: 12px;
      border: none;
      resize: none;
      background: rgba(255,255,255,0.1);
      color: white;
      outline: none;
      transition: box-shadow 0.3s;
    }

    select:focus, textarea:focus {
      box-shadow: 0 0 12px #4facfe;
    }

    .buttons {
      text-align: center;
      margin-top: 25px;
    }

    button {
      font-size: 1em;
      padding: 12px 20px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      margin: 6px;
      color: white;
      background: linear-gradient(45deg,#6a11cb,#2575fc);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: 0.25s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(106,17,203,0.6);
    }

    footer {
      text-align: center;
      padding: 40px 10px;
      background: rgba(255,255,255,0.05);
      border-top: 1px solid rgba(255,255,255,0.1);
      margin-top: 40px;
    }

    footer img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      box-shadow: 0 0 25px rgba(79,172,254,0.6);
    }

    .dark {
      background: linear-gradient(135deg, #000, #111, #1a1a1a);
      color: #eee;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌍 Penerjemah Bahasa Moni & Wolani</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section id="home">
    <h2 style="text-align:center;">🗣️ Fitur Penerjemah</h2>
    <div class="container">
      <div class="box">
        <label for="lang-from">Dari:</label>
        <select id="lang-from">
          <option value="moni">Moni Migani</option>
          <option value="wolani">Wolani</option>
          <option value="id">Indonesia</option>
        </select>
        <textarea id="input-text" rows="8" placeholder="✍️ Tulis teks di sini..."></textarea>
      </div>

      <div class="box">
        <label for="lang-to">Ke:</label>
        <select id="lang-to">
          <option value="id">Indonesia</option>
          <option value="moni">Moni Migani</option>
          <option value="wolani">Wolani</option>
        </select>
        <textarea id="output-text" rows="8" placeholder="✨ Hasil terjemahan muncul di sini..." readonly></textarea>
      </div>
    </div>

    <div class="buttons">
      <button onclick="swapLanguages()">🔄 Tukar</button>
      <button onclick="terjemahkan()">🚀 Terjemahkan</button>
      <button onclick="speak()">🔊 Baca Suara</button>
      <button onclick="copyText()">📋 Copy</button>
      <button onclick="toggleMode()">🌙/☀️ Mode</button>
    </div>
  </section>

  <footer>
    <img src="./DSC00592.JPG" alt="Foto Profil" />
    <h3>NELSON AGIMBAU</h3>
    <p>Email: <a href="mailto:bleknarson@gmail.com" style="color:#4facfe;">bleknarson@gmail.com</a></p>
    <p>📞 +62 877 4836 0368</p>
    <p>🌱 Pengembang pelestari <b>Bahasa Moni</b> & <b>Wolani</b></p>
  </footer>

  <script>
    // 🔠 Kamus Bahasa Moni & Wolani
    const kamusMoniKeId = {
      "aina":"kakak","ani":"adik","du":"air","ama":"mama","aita":"bapak",
      "anaju":"kakak perempuan","mbao":"tete","bawah":"nenek",
      "amakane":"terimakasih","amakanie":"terimakasih semua","imba":"rumah",
      "tali":"pasir","boh":"kayu","usah":"api","bigapa":"para-para",
      "taipa":"siang","timunggaga":"malam","goendo":"sore",
      "bega":"burung","tau":"setan","duna":"pintu","ambige":"duduk",
      "bagu":"panjang","puji":"pisang","wah":"keladi","mbalaga":"ubi jalar"
    };

    const kamusWolaniKeId = {
      "nio":"mama/mama ade","aita":"bapak","enyaa":"adik/anak","aba":"nenek",
      "nawaa":"kakak","amai":"tete","nimaitame":"teman/kawan/sahabat",
      "agai":"kamu","aga":"kamu","waii":"dia","nii":"saya","amano":"terimakasih",
      "gane":"kasihan","kayo":"dimana/kemana","amanoee":"sama-sama",
      "nadii":"lapar","nokekaoo nadii":"lapar makanan","ai":"(belum ada arti)"
    };

    const kamusIdKeMoni = Object.fromEntries(Object.entries(kamusMoniKeId).map(([k,v])=>[v,k]));
    const kamusIdKeWolani = Object.fromEntries(Object.entries(kamusWolaniKeId).map(([k,v])=>[v,k]));

    // Fungsi terjemahan
    function swapLanguages(){
      const from=document.getElementById("lang-from");
      const to=document.getElementById("lang-to");
      [from.value,to.value]=[to.value,from.value];
    }

    async function terjemahkan(){
      const input=document.getElementById("input-text").value.toLowerCase().trim();
      const dari=document.getElementById("lang-from").value;
      const ke=document.getElementById("lang-to").value;
      const output=document.getElementById("output-text");
      if(!input){output.value="⚠️ Masukkan teks dulu.";return;}
      output.value="⏳ Menerjemahkan...";
      let hasil=input;
      if(dari==="moni"&&ke==="id")hasil=kamusMoniKeId[input]||input;
      else if(dari==="id"&&ke==="moni")hasil=kamusIdKeMoni[input]||input;
      else if(dari==="wolani"&&ke==="id")hasil=kamusWolaniKeId[input]||input;
      else if(dari==="id"&&ke==="wolani")hasil=kamusIdKeWolani[input]||input;
      else hasil="⚠️ Kombinasi belum didukung.";
      output.value=hasil;
    }

    function speak(){
      const text=document.getElementById("output-text").value;
      if(!text)return;
      const utter=new SpeechSynthesisUtterance(text);
      utter.lang="id-ID";utter.rate=1;
      speechSynthesis.speak(utter);
    }

    function copyText(){
      const text=document.getElementById("output-text").value;
      if(!text){alert("Tidak ada teks untuk disalin.");return;}
      navigator.clipboard.writeText(text);
      alert("✅ Teks disalin!");
    }

    function toggleMode(){
      document.body.classList.toggle("dark");
      localStorage.setItem("mode",document.body.classList.contains("dark")?"dark":"light");
    }

    if(localStorage.getItem("mode")==="dark"){document.body.classList.add("dark");}
  </script>
</body>
</html>
